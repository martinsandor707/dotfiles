# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
[╭─](bold fg:255)$username$directory$fill$git_branch$all$fill$cmd_duration
$character"""

[fill]
symbol = '-'
style = 'fg:245'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[╰─λ](bold fg:255)"
error_symbol = "[](bold fg:249)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: 252"
symbol = "󰘬"
#truncation_length = 12
truncation_symbol = ""
format = "[ ](bold fg:252)[$symbol $branch(:$remote_branch)](fg:235 bg:252)[ ](bold fg:252)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:252 bold fg:235)[](bold fg:252)"
trim_at = ".companyname.com"
disabled = true

[line_break]
disabled = true

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:252 fg:235"
style_root = "red bold"
format = "[](bold fg:252)[$user]($style)[ ](bold fg:252)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:255 fg:black"
truncation_length = 0
truncate_to_repo = true
# truncation_symbol = "󰉋 → "
format = '[ ](bold fg:255)[$path]($style)[ ](bold fg:255)'
# REQUIRED: This flag must exist for Starship to evaluate repo_root_format
repo_root_style = "bg:255 fg:black"
# Format when IN a git repository
# Omitting $repo_root and $before_root_path replaces the directory name with the icon.
# $path handles subdirectories.
repo_root_format = '[ ](bold fg:255)[󰊤 $path]($style)[ ](bold fg:255)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[ ](bold fg:252)[took $duration](bold bg:252 fg:235)[ ](bold fg:252)'

# SYMBOLS
[status]
disabled = false
format = '[\[$symbol$status_common_meaning$status_signal_name$status_maybe_int\]]($style)'
map_symbol = true
pipestatus = true
symbol = "🔴"

# --- Environment / Tooling ---

[aws]
symbol = " "
format = "[ ](bold fg:252)[$symbol$profile](fg:235 bg:252)[ ](bold fg:252)"

[conda]
symbol = " "
format = "[ ](bold fg:252)[$symbol$environment](fg:235 bg:252)[ ](bold fg:252)"

[docker_context]
symbol = " "
format = "[ ](bold fg:252)[$symbol$context](fg:235 bg:252)[ ](bold fg:252)"

